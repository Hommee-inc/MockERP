[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mockerp"
version = "0.1.0"
description = "Mock ERP data generator for Databricks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Faker>=37,<38",
]

[tool.setuptools.packages.find]
where = ["src"]
